name: Test source and skaffold_file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy source directory and skaffold file
        run: |
          mkdir -p /tmp/my-source
          cat > /tmp/my-source/skaffold.yaml <<'EOF'
          apiVersion: skaffold/v3
          kind: Config
          metadata:
            name: my-app
          EOF

      - name: Run action with source and skaffold_file inputs (expect failure - no GCP credentials)
        id: action
        uses: .
        with:
          name: test-release-source
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          source: /tmp/my-source
          skaffold_file: skaffold.yaml
        continue-on-error: true

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (source and skaffold_file inputs accepted)"
