name: Test with disable_initial_rollout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with disable_initial_rollout (expect failure due to no GCP auth)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-003
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          disable_initial_rollout: 'true'
          deploy_parameters: 'key1=value1,key2=value2'

      - name: Assert action failed (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
