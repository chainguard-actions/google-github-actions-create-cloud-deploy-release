name: Test optional inputs - annotations, labels, description, deploy_parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with metadata optional inputs (expected to fail without GCP credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-metadata-001
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          annotations: env=test,team=platform
          labels: app=myapp,version=v1
          description: Test release for CI validation
          deploy_parameters: key1=value1,key2=value2

      - name: Assert action failed (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
