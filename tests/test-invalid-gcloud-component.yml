name: Test invalid gcloud_component input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid gcloud_component value
        id: action
        uses: .
        with:
          name: test-release-${{ github.run_id }}
          delivery_pipeline: test-pipeline
          region: us-central1
          project_id: test-project-id
          images: 'app=gcr.io/test-project/app:latest'
          gcloud_component: gamma
        continue-on-error: true

      - name: Assert action failed due to invalid gcloud_component
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid gcloud_component='gamma', but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid gcloud_component value"
