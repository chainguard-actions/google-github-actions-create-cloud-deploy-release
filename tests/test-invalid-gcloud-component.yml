name: Test invalid gcloud_component input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-release
          delivery_pipeline: my-pipeline
          images: 'my-image=gcr.io/my-project/my-image:latest'
          gcloud_component: gamma
      - name: Assert action failed with invalid gcloud_component error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when gcloud_component is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed when gcloud_component was set to an invalid value"
