name: Test conflicting build_artifacts and images inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-release
          delivery_pipeline: my-pipeline
          # Both build_artifacts and images are provided — this should fail
          build_artifacts: /path/to/artifacts.json
          images: 'my-image=gcr.io/my-project/my-image:latest'
      - name: Assert action failed when both build_artifacts and images are set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both build_artifacts and images are set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both build_artifacts and images were provided"
