name: Test source-related inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-source
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-gcp-project
          source: '.'
          skaffold_file: 'skaffold.yaml'
          gcs_source_staging_dir: 'gs://my-bucket/staging'
      - name: Assert action ran with source inputs (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run (fail at GCP auth), not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with source inputs (outcome=$OUTCOME)"
