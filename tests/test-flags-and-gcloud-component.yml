name: Test flags and gcloud_component inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with flags and gcloud_component inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-flags
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          gcloud_component: beta
          flags: '--skaffold-version=skaffold_preview'

      - name: Assert action ran (not skipped) with flags and gcloud_component inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should start and fail at GCP API call or gcloud setup, not at input validation
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted flags and gcloud_component inputs and ran with outcome: $OUTCOME"
