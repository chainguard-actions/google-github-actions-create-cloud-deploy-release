name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create build artifacts file
        run: |
          cat > /tmp/artifacts.json <<'EOF'
          {
            "builds": [
              {
                "imageName": "my-image",
                "tag": "gcr.io/my-project/my-image:latest"
              }
            ]
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-advanced-${{ github.run_id }}
          delivery_pipeline: my-pipeline
          region: us-central1
          build_artifacts: /tmp/artifacts.json
          gcs_source_staging_dir: gs://my-bucket/staging
          skaffold_file: skaffold.yaml
          annotations: "env=test,team=platform"
          labels: "version=1,app=myapp"
          description: "Test release for CI"
          deploy_parameters: "key1=value1,key2=value2"
          flags: "--skaffold-version=skaffold_preview"
          gcloud_version: "latest"
          gcloud_component: "beta"
          project_id: my-gcp-project
      - name: Assert action ran (may fail due to missing GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
