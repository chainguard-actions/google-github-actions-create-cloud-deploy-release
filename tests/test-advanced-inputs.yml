name: Test advanced inputs - artifacts, skaffold, annotations, labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-release-advanced
          delivery_pipeline: my-pipeline
          build_artifacts: artifacts.json
          gcs_source_staging_dir: gs://my-bucket/staging
          skaffold_file: skaffold.yaml
          annotations: "env=test,team=platform"
          labels: "version=1,app=myapp"
          description: "Test release for CI"
          gcloud_version: "latest"
      - name: Assert action ran (credentials missing is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
