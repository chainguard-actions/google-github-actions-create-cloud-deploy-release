name: Test missing required inputs causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Omitting required 'name' and 'delivery_pipeline' inputs should cause the action to fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          region: us-central1
      - name: Assert action failed due to missing required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected 'failure' when required inputs are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
