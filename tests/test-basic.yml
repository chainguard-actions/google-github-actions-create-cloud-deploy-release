name: Test basic usage - create cloud deploy release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-release-${{ github.run_number }}
          delivery_pipeline: my-pipeline
          region: us-central1
          source: .
          images: "my-image=gcr.io/my-project/my-image:latest"
          project_id: my-gcp-project
          gcloud_version: "latest"
          disable_initial_rollout: "false"
      - name: Assert action ran (may fail without GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
