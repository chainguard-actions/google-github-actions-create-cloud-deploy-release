name: Test optional inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-002
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-gcp-project
          disable_initial_rollout: 'true'
          description: 'Test release for CI'
          labels: 'env=test,team=ci'
          annotations: 'created-by=act'
      - name: Assert action ran with optional inputs (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run (fail at GCP auth), not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with optional inputs (outcome=$OUTCOME)"
