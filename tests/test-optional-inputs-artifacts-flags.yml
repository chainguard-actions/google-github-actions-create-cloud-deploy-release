name: Test optional inputs - build_artifacts, flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake build artifacts file for input coverage
        run: |
          cat > /tmp/artifacts.json <<'EOF'
          {
            "builds": [
              {
                "imageName": "gcr.io/my-project/my-image",
                "tag": "gcr.io/my-project/my-image:latest"
              }
            ]
          }
          EOF

      - name: Invoke action with build_artifacts and flags inputs (expected to fail without GCP credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-artifacts-001
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          build_artifacts: /tmp/artifacts.json
          flags: --skaffold-version=skaffold_preview

      - name: Assert action failed (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
