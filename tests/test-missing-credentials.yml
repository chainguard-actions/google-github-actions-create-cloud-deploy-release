name: Test missing GCP credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action and expect failure due to missing credentials
        id: action
        uses: .
        with:
          name: test-release-${{ github.run_id }}
          delivery_pipeline: test-pipeline
          region: us-central1
          project_id: test-project-id
          images: 'app=gcr.io/test-project/app:latest'
        continue-on-error: true

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
