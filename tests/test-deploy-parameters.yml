name: Test deploy_parameters input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with deploy_parameters input (expect failure - no GCP credentials)
        id: action
        uses: .
        with:
          name: test-release-deploy-params
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          images: 'my-image=gcr.io/my-project/my-image:latest'
          deploy_parameters: 'env=production,replicas=3'
        continue-on-error: true

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (deploy_parameters input accepted)"
