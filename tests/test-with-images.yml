name: Test with images input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with images input (expect failure due to no GCP auth)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-002
          delivery_pipeline: my-pipeline
          region: us-east1
          project_id: my-test-project
          images: 'my-app=gcr.io/my-project/my-app:v1.0.0'
          description: 'Test release with images'
          labels: 'env=test,team=platform'
          annotations: 'created-by=ci'

      - name: Assert action failed (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
