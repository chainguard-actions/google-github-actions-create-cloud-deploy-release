name: Test missing delivery_pipeline input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-release
          images: 'my-image=gcr.io/my-project/my-image:latest'
      - name: Assert action failed with missing delivery_pipeline error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when delivery_pipeline is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when delivery_pipeline input was missing"
