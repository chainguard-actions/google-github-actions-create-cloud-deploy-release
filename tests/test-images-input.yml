name: Test images input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with images input (no GCP credentials)
        id: action
        uses: .
        with:
          name: test-release-images
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          images: 'my-app=gcr.io/my-project/my-app:v1.0.0'
        continue-on-error: true

      - name: Assert action ran with images input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should start and fail at GCP API call, not at input validation
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted images input and ran with outcome: $OUTCOME"
