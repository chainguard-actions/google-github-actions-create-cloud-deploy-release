name: Test required inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required delivery_pipeline input
        id: action
        uses: .
        with:
          name: test-release-${{ github.run_id }}
          # delivery_pipeline is intentionally omitted to trigger validation error
          region: us-central1
          project_id: test-project-id
        continue-on-error: true

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when delivery_pipeline is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input delivery_pipeline was missing"
