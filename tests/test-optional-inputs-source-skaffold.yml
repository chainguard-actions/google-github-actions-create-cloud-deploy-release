name: Test optional inputs - source, skaffold_file, gcs_source_staging_dir, gcloud_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with source/skaffold optional inputs (expected to fail without GCP credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-release-source-001
          delivery_pipeline: my-pipeline
          region: us-central1
          project_id: my-test-project
          source: ./
          skaffold_file: skaffold.yaml
          gcs_source_staging_dir: gs://my-bucket/staging
          gcloud_version: latest

      - name: Assert action failed (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
